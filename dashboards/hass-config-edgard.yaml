      \ e ${activeParts[activeParts.length - 1]} ligados`;\n\n  const w = states['weather.openweathermap'];\n  const condMap\
      \ = {\n    'sunny': 'Ensolarado', 'clear-night': 'Céu limpo', 'cloudy': 'Nublado',\n    'partlycloudy': 'Parc. nublado',\
