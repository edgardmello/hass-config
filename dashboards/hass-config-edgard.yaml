      \ = lightIds.filter(id => states[id]?.state === 'on');\n  const devsOn = devIds\n    .filter(([id]) => ['on', 'cool',\
      \ 'heat', 'dry', 'auto', 'fan_only', 'playing'].includes(states[id]?.state))\n    .map(([, label]) => label);\n\n  let\
      \ activeParts = [];\n  if (lightsOn.length === 1) {\n    activeParts.push(states[lightsOn[0]]?.attributes?.friendly_name\
      \ || '1 luz');\n  } else if (lightsOn.length > 1) {\n    activeParts.push(`${lightsOn.length} luzes`);\n  }\n  activeParts\
      \ = activeParts.concat(devsOn);\n  let activeStr = activeParts.length === 0\n    ? `<font color=\"#6a7377\">Tudo desligado</font>`\n\
