homeassistant:
  customize:
    sensor.nas_volume_1_average_disk_temp:
      friendly_name: Disktemperatur
    sensor.system_monitor_processor_use:
      icon: mdi:chip

# Note: `sensor: - platform: systemmonitor` was removed in HA 2024.9.
# Configure the System Monitor integration via Settings -> Devices & Services -> Add Integration -> System Monitor.
sensor:
  # https://github.com/NemesisRE/sensor.plex_recently_added
  - platform: plex_recently_added
    host: !secret nas_host
    port: !secret plex_port
    token: !secret plex_token
    max: 1
    img_dir: /
    image_resolution: 800

template:
  - sensor:
      - unique_id: nas_status
        default_entity_id: sensor.template_nas_status
        name: Systemhälsa
        icon: cil:synology-nas
        state: >
          {% set entity_id = 'sensor.nas_volume_1_status' %}
          {% if is_state(entity_id, 'normal') %}
            Bra
          {% elif is_state(entity_id, 'background_scrubbing') %}
            Dataskrubbning
          {% else %}
            {{ states(entity_id) }}
          {% endif %}

      - unique_id: domain_counter
        default_entity_id: sensor.template_domain_counter
        name: Domain Counter
        state: >
          {{ states | count }}
        attributes:
          automation: >
            {{ states.automation | count }}
          binary_sensor: >
            {{ states.binary_sensor | count }}
          device_tracker: >
            {{ states.device_tracker | count }}
          light: >
            {{ states.light | count }}
          media_player: >
            {{ states.media_player | count }}
          sensor: >
            {{ states.sensor | count }}
          switch: >
            {{ states.switch | count }}
          other: >
            {% set exclude = ['automation', 'binary_sensor', 'device_tracker', 'light', 'media_player', 'sensor', 'switch'] %}
            {{ states | rejectattr('domain', 'in', exclude) | list | count }}

shell_command:
  restart_container: !secret restart_container
  purge_log: truncate -s 0 /config/home-assistant.log

# https://github.com/ualex73/monitor_docker
monitor_docker:
  - name: Docker
    containers:
      - watchtower
      - homeassistant
      - transmission-seed
    monitored_conditions: allinone
    scan_interval: 900

automation:
  - alias: purge_log_filesize
    id: '3331821824310'
    triggers:
      - trigger: numeric_state
        entity_id: sensor.home_assistant_log_size
        above: 50
    actions:
      - action: shell_command.purge_log

  - alias: backup_ha_monthly
    triggers:
      - trigger: time
        at: '04:00:00'
    conditions:
      - condition: template
        value_template: >
          {{ now().day == 1 }}
    actions:
      - action: backup.create
