shell_command:
  monitors_mute_on: !secret monitors_mute_on
  monitors_mute_off: !secret monitors_mute_off
  monitors_volume_slider: !secret monitors_volume_slider
  monitors_calibrate_monitors: !secret monitors_calibrate_monitors
  monitors_calibrate_headphones: !secret monitors_calibrate_headphones

input_number:
  monitors_volume:
    name: Volym
    icon: mdi:volume-high
    initial: 20
    min: 7
    max: 75
    step: 1
    unit_of_measurement: '%'

homeassistant:
  customize:
    switch.gosund_monitors_switch:
      friendly_name: Monitorer
      icon: cil:studio-monitor
    automation.monitors_turn_off:
      friendly_name: Stäng av när dator stängs av
      icon: mdi:power
    automation.monitors_calibration:
      friendly_name: Automatisk kalibrationsprofil
      icon: cil:eq-calibrate

# Migrated from legacy `switch: - platform: template` (removed in HA 2026.6)
template:
  - switch:
      - unique_id: monitors_mute
        default_entity_id: switch.monitors_mute
        name: Monitors Mute
        state: >
          {{ is_state('binary_sensor.monitors_mute_state', 'on') }}
        turn_on:
          - action: shell_command.monitors_mute_on
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.monitors_mute_state
        turn_off:
          - action: shell_command.monitors_mute_off
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.monitors_mute_state

command_line:
  - sensor:
      name: monitors_volume
      command: !secret monitors_update_volume
      unit_of_measurement: '%'
      scan_interval: 86400

  - binary_sensor:
      name: monitors_mute_state
      command: !secret monitors_mute_state
      payload_on: 'true'
      payload_off: 'false'
      device_class: sound
      scan_interval: 86400

automation:
  - alias: monitors_conditional_scan_interval
    id: '9725321162273'
    triggers:
      - trigger: time_pattern
        minutes: /15
      - trigger: state
        entity_id: switch.imac
        from: 'off'
        to: 'on'
    conditions:
      - condition: state
        entity_id: switch.imac
        state: 'on'
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.monitors_volume
            - binary_sensor.monitors_mute_state

  - alias: monitors_volume_slider
    id: '5219419667118'
    triggers:
      - trigger: state
        entity_id: input_number.monitors_volume
    conditions:
      - condition: state
        entity_id: switch.imac
        state: 'on'
    actions:
      - action: shell_command.monitors_volume_slider
      - action: homeassistant.update_entity
        target:
          entity_id:
            - binary_sensor.monitors_mute_state
            - sensor.monitors_volume

  - alias: monitors_volume_update
    id: '9267857456002'
    variables:
      min: 7
      max: 75
      volume: >
        {{ states(trigger.entity_id) | float(0) | round }}
    triggers:
      - trigger: state
        entity_id: sensor.monitors_volume
    conditions:
      - condition: state
        entity_id: switch.imac
        state: 'on'
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: binary_sensor.monitors_mute_state
      - action: input_number.set_value
        target:
          entity_id: input_number.monitors_volume
        data:
          value: >
            {{ max if volume > max else iif(volume < min, min, volume) }}

  - alias: monitors_calibration
    id: '7788453610415'
    mode: queued
    triggers:
      - trigger: state
        entity_id: switch.gosund_monitors_switch
        from:
          - 'on'
          - 'off'
        to:
          - 'on'
          - 'off'
    actions:
      - if:
          - condition: state
            entity_id: switch.gosund_monitors_switch
            state: 'on'
        then:
          - action: shell_command.monitors_calibrate_monitors
        else:
          - action: shell_command.monitors_calibrate_headphones

  - alias: monitors_turn_off
    id: '7513071342679'
    triggers:
      - trigger: state
        entity_id: switch.imac
        from: 'on'
        to: 'off'
        for:
          minutes: 15
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.gosund_monitors_switch
