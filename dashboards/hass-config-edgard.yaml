      \ lowBat.push(`${label} ${Math.round(v)}%`);\n  }\n  const batStr = lowBat.length ? `⚠️ Bateria baixa: ${lowBat.slice(0,\
      \ 3).join(', ')}` : '';\n\n  const blocks = [\n    `<span class=\"time\">${hh}<span class=\"time-colon\">:</span>${mm}</span>`,\n\
      \    `<font color=\"#6a7377\"><b>${dateStr}</b></font>`,\n    `<b>${greet}</b>`,\n    `<b>${activeStr}</b>`,\n    weatherStr,\n\
      \    vacStr,\n    modeStr,\n    energyStr,\n    batStr\n  ].filter(Boolean);\n\n  return blocks.map(b => `<p>${b}</p>`).join('');\n\
      ]]]"
