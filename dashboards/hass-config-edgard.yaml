      \  };\n  let weatherStr = '';\n  if (w && w.state !== 'unavailable') {\n    const t = Math.round(w.attributes.temperature);\n\
      \    const feels = w.attributes.apparent_temperature != null ? Math.round(w.attributes.apparent_temperature) : t;\n\
      \    const hum = w.attributes.humidity;\n    const cond = condMap[w.state] || w.state;\n    weatherStr = `${cond} ·\
      \ ${t}°C (sensação ${feels}°C) · ${hum}%`;\n  }\n\n  const vac = states['vacuum.escritorio_eufy_x10_pro'];\n  let vacStr\
      \ = '';\n  if (vac?.state === 'cleaning') vacStr = '<b>\U0001F916 Eufy X10 aspirando</b>';\n  else if (vac?.state ===\
      \ 'returning') vacStr = '<b>\U0001F916 Eufy X10 voltando à base</b>';\n\n  let modeParts = [];\n  if (states['lock.kuanttum_delta_pro_operate_lock']?.state\
      \ === 'unlocked') modeParts.push('\U0001F513 Porta destrancada');\n  if (states['input_boolean.modo_visitas']?.state\
