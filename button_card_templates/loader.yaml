loader:
  custom_fields:
    loader: >
      <img src="/local/loader.svg" width="100%">
  tap_action:
    loader: >
      [[[
        if (entity) {
            let elt = this.shadowRoot,
                loader = (id, style) => {
                  let el = elt?.getElementById(id);
                  if (el) {
                    el.style.display = style;
                    window.setTimeout(() => {
                      let l = elt?.getElementById('loader');
                      if (l) l.style.display = 'none';
                    }, 20000);
                  }
                };
            loader('circle', 'none');
            loader('loader', 'initial');
        }
      ]]]
  styles:
    custom_fields:
      loader:
        - display: none
        - top: -6%
        - right: -3.5%
        - width: 52%
        - position: absolute
        - opacity: 0.5
        - pointer-events: none
        - filter: >
            [[[
              return variables.state_on
                  ? 'none'
                  : 'invert(1)';
            ]]]
