shell_command:
  imac_off: !secret imac_off
  imac_sleep: !secret imac_sleep
  imac_restart: !secret imac_restart

input_boolean:
  imac_lock:
    name: Avstängningslås
    icon: cil:lock

switch:
  - platform: wake_on_lan
    name: imac_wol
    host: !secret imac_wol_host
    mac: !secret imac_wol_mac

command_line:
  - sensor:
      name: imac_cpu
      command: !secret imac_cpu
      unit_of_measurement: '%'
      value_template: >
        {{ (100 - value[:-1] | float(default=0)) | round(1) }}
      scan_interval: 86400

  - sensor:
      name: imac_mem
      command: !secret imac_mem
      unit_of_measurement: '%'
      scan_interval: 86400

  - sensor:
      name: imac_uptime
      command: !secret imac_uptime
      value_template: >
        {% set timestamp = value[:-1] | int(default=0) %}
        {% set year = 86400 * 365 %}
        {{ timestamp | timestamp_local if (as_timestamp(now()) - timestamp) < year else None }}
      scan_interval: 86400

  - sensor:
      name: imac_ip
      command: !secret imac_ip
      scan_interval: 86400

homeassistant:
  customize:
    sensor.imac_cpu:
      friendly_name: Processor
      icon: mdi:chip
    sensor.imac_mem:
      friendly_name: Minne
      icon: mdi:memory
    automation.imac_notification_motion_hall:
      friendly_name: Mottag notiser
      icon: mdi:bell
    sensor.imac_uptime:
      friendly_name: Senaste omstart
      icon: mdi:update
      device_class: timestamp

# Migrated legacy template switch & modernized template sensor properties for HA 2026.11
template:
  - switch:
      - unique_id: imac
        default_entity_id: switch.imac
        name: Dator
        icon: cil:imac-alternative
        state: >
          {{ is_state('switch.imac_wol', 'on') }}
        turn_on:
          - action: browser_mod.notification
            data:
              message: Dator måste manuellt slås på!
          - action: light.turn_on
            target:
              entity_id: light.studio_dator
        turn_off:
          - if:
              - condition: state
                entity_id: input_boolean.imac_lock
                state: 'off'
            then:
              - action: shell_command.imac_off

  - binary_sensor:
      - unique_id: imac_vpn
        default_entity_id: binary_sensor.template_imac_vpn
        name: VPN
        device_class: connectivity
        icon: >
          mdi:shield-{{ iif(this.state == 'on', 'check', 'alert') }}
        state: >
          {{ is_state('switch.imac', 'on') and states('sensor.imac_ip')
          not in [states('sensor.myip'), 'unknown', 'unavailable'] }}

  - sensor:
      - unique_id: imac_macintosh_hd
        default_entity_id: sensor.template_imac_macintosh_hd
        name: Macintosh HD
        icon: cil:imac-ssd
        unit_of_measurement: '%'
        state: >
          {{ (100 - states('sensor.imac_storage') | float(0)) | round(1) }}

automation:
  - alias: imac_on_lights
    id: '6164870619519'
    triggers:
      - trigger: state
        entity_id: switch.imac
        from: 'off'
        to: 'on'
      - trigger: state
        entity_id: switch.imac
        from: 'on'
        to: 'off'
        for:
          minutes: 30
    actions:
      - action: >
          light.turn_{{ trigger.to_state.state }}
        target:
          entity_id: light.studio_dator

  - alias: imac_notification_motion_hall
    id: '6635187142734'
    initial_state: false
    triggers:
      - trigger: state
        entity_id: binary_sensor.hall_motion_motion
        from: 'off'
        to: 'on'
    conditions:
      - condition: state
        entity_id: binary_sensor.imac_active
        state: 'on'
    actions:
      - action: notify.mobile_app_imac
        data:
          message: Rörelse i hallen detekterat
          title: Home Assistant

  - alias: imac_conditional_scan_interval
    id: '1651201800159'
    triggers:
      - trigger: time_pattern
        minutes: /15
      - trigger: state
        entity_id: switch.imac
        from: 'off'
        to: 'on'
    conditions:
      - condition: state
        entity_id: switch.imac
        state: 'on'
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.imac_cpu
            - sensor.imac_mem
            - sensor.imac_uptime
            - sensor.imac_ip
